[project]
name = "fastapi-example"
version = "0.1.0"
description = "A minimal FastAPI app with best-practice structure"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "pydantic-settings>=2.1.0",
]

[project.urls]
Homepage = "https://example.com"

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC"]
ignore = [
    # Allow prints in small examples
    "T201",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
# For uv: install with `uv sync --group dev`
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

